<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A UFO with a light beam over Scottish hills at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1c2a4a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ef0a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5ef0a0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#eef1ff">
    <circle cx="30" cy="30" r="1.6"/><circle cx="80" cy="60" r="1.2"/><circle cx="120" cy="22" r="1.8"/>
    <circle cx="300" cy="35" r="1.4"/><circle cx="350" cy="70" r="1.8"/><circle cx="375" cy="25" r="1.2"/>
    <circle cx="60" cy="110" r="1.1"/><circle cx="330" cy="120" r="1.2"/><circle cx="260" cy="18" r="1.1"/>
    <circle cx="20" cy="150" r="1.3"/><circle cx="385" cy="150" r="1.1"/>
  </g>
  <!-- Moon -->
  <circle cx="335" cy="55" r="16" fill="#f3efd8"/>
  <circle cx="342" cy="50" r="14" fill="url(#sky)"/>
  <!-- Beam -->
  <path d="M182 128 L218 128 L268 262 L132 262 Z" fill="url(#beam)"/>
  <!-- Hills -->
  <path d="M0 230 C50 200 90 186 140 196 C180 204 200 222 230 214 C270 202 300 176 340 182 C370 186 390 200 400 206 V300 H0 Z" fill="#0d1428" stroke="#5ef0a0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M0 262 C60 244 120 240 200 252 C280 264 340 250 400 240 V300 H0 Z" fill="#0a1022" stroke="#5ef0a0" stroke-width="3" stroke-linejoin="round"/>
  <!-- Saucer -->
  <g fill="none" stroke="#5ef0a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 104 C172 84 186 72 200 72 C214 72 228 84 228 104"/>
    <ellipse cx="200" cy="112" rx="62" ry="15" fill="#0b1020"/>
    <path d="M172 104 H228"/>
    <path d="M150 112 H250" stroke-width="2.5"/>
  </g>
  <g fill="#5ef0a0">
    <circle cx="160" cy="118" r="3.5"/><circle cx="180" cy="122" r="3.5"/><circle cx="200" cy="124" r="3.5"/>
    <circle cx="220" cy="122" r="3.5"/><circle cx="240" cy="118" r="3.5"/>
  </g>
</svg>
